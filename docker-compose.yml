version: "3.9"

services:
  punarshakti-api:
    build: .
    container_name: punarshakti-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
